<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">

<title>24bit7</title>
<style>
  :root { --bg: #ffffff; --text: #1b1b1b; --accent: #c0187a; }

  a { color: var(--accent); }

</head>
<body>
<main>

</html>
