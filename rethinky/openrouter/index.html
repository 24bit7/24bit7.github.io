<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Back to ReThinky</title>
<style>
  :root { --bg: #000000; --text: #eeeeee; --muted: #aaaaaa; --accent: #ff4fb4; }
  body { background: var(--bg); color: var(--text); font: 17px/1.6 system-ui, sans-serif; margin: 0; padding: 48px 16px; text-align: center; }
  main { max-width: 480px; margin: 0 auto; }
  h1 { font-size: 1.6em; }
  p { color: var(--muted); }
  a.button { display: inline-block; margin-top: 16px; padding: 12px 28px; border: 2px solid var(--accent); border-radius: 28px; color: var(--text); text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<main>
<h1>Back to ReThinky</h1>
<p id="say">You're signed in with OpenRouter. ReThinky should open by itself to save your key.</p>
<a class="button" id="back" href="#">Open ReThinky</a>
</main>
<script>
  // Top Up as You Go: OpenRouter sends the browser here with a one-time code, and this page hands it
  // straight to the app on this phone. The code is useless anywhere else: only the app holds the
  // secret it is checked against. Nothing is stored or sent anywhere from this page.
  var APP = "com.walkerwilliams.rethinkies";
  var query = new URLSearchParams(location.search);
  var code = query.get("code");
  var state = query.get("state") || "";
  if (!code) {
    document.getElementById("say").textContent = "Something went wrong signing in. Go back to ReThinky and try Sign In again.";
  }
  var params = "code=" + encodeURIComponent(code || "") + "&state=" + encodeURIComponent(state);
  var link = /Android/i.test(navigator.userAgent)
    ? "intent://openrouter?" + params + "#Intent;scheme=" + APP + ";package=" + APP + ";end"
    : APP + "://openrouter?" + params;
  document.getElementById("back").href = link;
  if (code) location.href = link;
</script>
</body>
</html>
